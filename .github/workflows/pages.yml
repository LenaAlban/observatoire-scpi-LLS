name: Observatoire SCPI - actualisation et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifiant de suivi d'une actualisation à la demande
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: observatoire-scpi-pages
  cancel-in-progress: true

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt
      - name: Vérifier les données et les calculs
        run: python -m unittest discover -s tests -v
      - name: Vérifier le JavaScript avant publication
        run: python scripts/check_frontend.py
      - name: Tester la sécurité du déclencheur à la demande
        run: node --test worker/test.mjs
      - name: Collecter tous les bulletins officiels (veille quotidienne ou demande)
        if: github.event_name != 'push'
        env:
          SCPI_REFRESH_REQUEST: ${{ github.event.inputs.request_id }}
        run: python scripts/sync.py --request-id "$SCPI_REFRESH_REQUEST"
      # Sur push : publier rapidement le site sans attendre les téléchargements PDF.
      # Les collectes complètes sont exécutées sur planning et workflow_dispatch.
      - name: Enregistrer les nouvelles données (si changement)
        if: github.event_name != 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'SCPI Sync Bot'
          git config user.email 'scpi-sync-bot@users.noreply.github.com'
          git add data/scpi.json data/status.json
          git diff --cached --quiet || (git commit -m 'Actualisation quotidienne SCPI' && git push)
      - name: Préparer le site public (sans code de collecte)
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/scpi.json data/status.json public/data/
          touch public/.nojekyll
      - name: Publier uniquement l'URL du service sécurisé (jamais ses secrets)
        env:
          REFRESH_WORKER_URL: ${{ vars.SCPI_REFRESH_WORKER_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          raw=os.environ.get('REFRESH_WORKER_URL','').strip()
          endpoint=''
          if raw:
              u=urlparse(raw)
              if u.scheme!='https' or not u.hostname or u.username or u.password or u.query or u.fragment or u.path not in ('','/'):
                  raise SystemExit('SCPI_REFRESH_WORKER_URL doit être une URL de base HTTPS sans chemin ni paramètres')
              endpoint=raw.rstrip('/')+'/run'
          Path('public/refresh-config.json').write_text(json.dumps({'endpoint':endpoint})+'\n',encoding='utf-8')
          PY
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Envoyer le site à GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    runs-on: ubuntu-latest
    needs: preparer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mettre l'observatoire en ligne
        id: deployment
        uses: actions/deploy-pages@v4
