name: Observatoire SCPI - actualisation et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: observatoire-scpi-pages
  cancel-in-progress: true

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt
      - name: Vérifier les données et les calculs
        run: python -m unittest discover -s tests -v
      - name: Vérifier le JavaScript avant publication
        run: python scripts/check_frontend.py
      - name: Collecter les bulletins officiels et les clés de démembrement
        if: github.event_name != 'push'
        run: python scripts/sync.py
      - name: Enregistrer les nouvelles données (si changement)
        if: github.event_name != 'push'
        run: |
          git config user.name 'SCPI Sync Bot'
          git config user.email 'scpi-sync-bot@users.noreply.github.com'
          git add data/scpi.json data/status.json
          git diff --cached --quiet || (git commit -m 'Actualisation quotidienne SCPI' && git push)
      - name: Préparer le site public (sans code de collecte)
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/scpi.json data/status.json public/data/
          touch public/.nojekyll
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Envoyer le site à GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    runs-on: ubuntu-latest
    needs: preparer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mettre l'observatoire en ligne
        id: deployment
        uses: actions/deploy-pages@v4
